services:
  - type: web
    name: scheme-saathi-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start --workspace=server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: USE_MOCK_AI
        value: "true"
      - key: SHOW_UNVERIFIED
        value: "false"
